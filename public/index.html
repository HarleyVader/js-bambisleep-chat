  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">

  <!-- Dynamic CSS Loading - Mobile vs Desktop Detection -->
  <script>
    // Detect if device is mobile/tablet vs desktop
    function isMobileDevice() {
      const userAgent = navigator.userAgent.toLowerCase();
      const isMobileUA = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent);
      const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

      // Consider it mobile if it matches mobile user agent OR has touch capability
      return isMobileUA || isTouchDevice;
    }

    // Load appropriate CSS based on device type
    function loadDeviceCSS() {
      const head = document.head;

      // Always load the base style.css (includes @imports for all other CSS)
      const baseCSS = document.createElement('link');
      baseCSS.rel = 'stylesheet';
      baseCSS.href = '/css/style.css';
      head.appendChild(baseCSS);

      // Only load mobile.css if it's actually a mobile device
      if (isMobileDevice()) {
        // Add mobile class to body for additional targeting
        document.addEventListener('DOMContentLoaded', function() {
          document.body.classList.add('mobile-device');
        });
      } else {
        // Add desktop class to body for additional targeting
        document.addEventListener('DOMContentLoaded', function() {
          document.body.classList.add('desktop-device');
        });
      }
    }

    // Load CSS immediately
    loadDeviceCSS();
  </script>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

  <!-- Resource Monitor Button -->

        </div>
      </div>
    </div>

  <!-- Resource Monitor Script -->
  <script>
    class ResourceMonitor {
      constructor() {
        this.updateInterval = null;
        this.init();
      }

      init() {
        console.log('💾 Resource Monitor initialized');
        this.startMonitoring();
      }

      startMonitoring() {
        // Update every 1.5 seconds
        this.updateInterval = setInterval(() => {
          this.updateStats();
        }, 1500);

        // Initial update
        this.updateStats();
      }

      updateStats() {
        // Memory usage
        if (performance.memory) {
          const memoryMB = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
          document.getElementById('memory-usage').textContent = `${memoryMB}MB`;
        } else {
          document.getElementById('memory-usage').textContent = 'N/A';
        }

        // TTS queue size
        if (window.tts) {
          const queueSize = (window.tts.textArray?.length || 0) + (window.tts.audioArray?.length || 0);
          document.getElementById('tts-queue-size').textContent = queueSize;
        } else {
          document.getElementById('tts-queue-size').textContent = '--';
        }

        // Blob URLs count
        if (window.tts && window.tts.blobUrls) {
          document.getElementById('blob-count').textContent = window.tts.blobUrls.size;
        } else {
          document.getElementById('blob-count').textContent = '--';
        }

        // Socket status
        const socketStatus = this.getSocketStatus();
        document.getElementById('socket-status').textContent = socketStatus;
      }

      getSocketStatus() {
        if (window.chatCore && window.chatCore.socket) {
          return window.chatCore.socket.connected ? 'Connected' : 'Disconnected';
        }
        return 'No Socket';
      }

      cleanup() {
        if (this.updateInterval) {
          clearInterval(this.updateInterval);
          this.updateInterval = null;
        }
      }
    }

    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      window.resourceMonitor = new ResourceMonitor();
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (window.resourceMonitor) {
        window.resourceMonitor.cleanup();
      }
    });
  </script>

  <!-- Cleanup socket connections on page unload -->
  <script>
    window.addEventListener('beforeunload', () => {
      if (window.globalSocket && window.globalSocket.connected) {
        console.log('🔌 Cleaning up socket connection before page unload');
        window.globalSocket.disconnect();
        window.globalSocket = null;
      }

      // Cleanup TTS system
      if (window.tts && window.tts.cleanup) {
        window.tts.cleanup();
      }
    });
  </script>
