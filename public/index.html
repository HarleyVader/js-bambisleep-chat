<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BambiSleepChat</title>

    <!-- Favicon and Icon Links for All Devices -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/site.webmanifest">

    <!-- Mobile Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BambiSleep.Chat">
    <meta name="application-name" content="BambiSleep.Chat">

    <!-- Dynamic CSS Loading - Mobile vs Desktop Detection -->
    <script>
        // Detect if device is mobile/tablet vs desktop
        function isMobileDevice() {
            const userAgent = navigator.userAgent.toLowerCase();
            const isMobileUA = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent);
            const isSmallScreen = window.innerWidth <= 480;
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            
            // Consider it mobile if it matches mobile user agent OR (small screen AND touch)
            return isMobileUA || (isSmallScreen && isTouchDevice);
        }        // Load appropriate CSS based on device type
        function loadDeviceCSS() {
            const head = document.head;

            // Always load the base style.css
            const baseCSS = document.createElement('link');
            baseCSS.rel = 'stylesheet';
            baseCSS.href = '/css/style.css';
            head.appendChild(baseCSS);

            // Only load mobile.css if it's actually a mobile device
            if (isMobileDevice()) {
                const mobileCSS = document.createElement('link');
                mobileCSS.rel = 'stylesheet';
                mobileCSS.href = '/css/mobile.css';
                head.appendChild(mobileCSS);

                // Add mobile class to body for additional targeting
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.classList.add('mobile-device');
                });
            } else {
                // Add desktop class to body for additional targeting
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.classList.add('desktop-device');
                });
            }
        }

        // Load CSS immediately
        loadDeviceCSS();
    </script>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Spiral Animation Canvas -->
        <div id="spiral-container">
            <div id="eye" class="spiral-text-center"></div>
        </div>

        <!-- Chat Container -->
        <div id="chat-container">
            <div id="chat-header">
                <h1>🧠BambiSleep.Chat🌀</h1>
                <div id="controls" class="controls">
                    <div class="dropdown">
                        <button id="toggle-spiral" class="dropdown-btn toggle-button" data-state="off">Spiral: OFF</button>
                        <div class="dropdown-content">
                            <!-- Content will be populated by spiral-dropdown.js -->
                        </div>
                    </div>
                    <div class="dropdown">
                        <button id="toggle-tts" class="dropdown-btn toggle-button" data-state="off">TTS: OFF</button>
                        <div class="dropdown-content">
                            <!-- Content will be populated by tts-dropdown.js -->
                        </div>
                    </div>
                    <div class="dropdown">
                        <button id="toggle-triggers" class="dropdown-btn toggle-button" data-state="off">Triggers: OFF</button>
                        <div class="dropdown-content">
                            <!-- Content will be populated by triggers-dropdown.js -->
                        </div>
                    </div>
                    <div class="dropdown">
                        <button id="toggle-ai" class="dropdown-btn toggle-button" data-state="off">AI: OFF</button>
                        <div class="dropdown-content">
                            <!-- Content will be populated by ai-dropdown.js -->
                        </div>
                    </div>
                    <div class="dropdown collar-dropdown">
                        <button id="toggle-collar" class="dropdown-btn toggle-button" data-state="off">Collar: OFF</button>
                        <div class="dropdown-content">
                            <!-- Content will be populated by collar-dropdown.js -->
                        </div>
                    </div>
                </div>
            </div>

            <div id="chat-messages"></div>

            <div id="chat-input-container">
                <input type="text" id="chat-input" placeholder="Type your message..." maxlength="500">
                <button id="send-button">Send</button>
            </div>
        </div>

        <!-- Mobile Navigation Bar -->
        <nav class="mobile-nav">
            <button class="mobile-nav-btn" id="mobile-chat-btn">
                <div class="mobile-nav-btn-icon">💬</div>
                <div class="mobile-nav-btn-label">Chat</div>
            </button>
            <button class="mobile-nav-btn" id="mobile-spiral-btn">
                <div class="mobile-nav-btn-icon">🌀</div>
                <div class="mobile-nav-btn-label">Spiral</div>
            </button>
            <button class="mobile-nav-btn" id="mobile-triggers-btn">
                <div class="mobile-nav-btn-icon">⚡</div>
                <div class="mobile-nav-btn-label">Triggers</div>
            </button>
            <button class="mobile-nav-btn" id="mobile-tts-btn">
                <div class="mobile-nav-btn-icon">🔊</div>
                <div class="mobile-nav-btn-label">Voice</div>
            </button>
            <button class="mobile-nav-btn" id="mobile-ai-btn">
                <div class="mobile-nav-btn-icon">🤖</div>
                <div class="mobile-nav-btn-label">AI</div>
            </button>
        </nav>

        <!-- Mobile Panels -->
        <div id="mobile-spiral-panel" class="mobile-panel">
            <div class="mobile-panel-header">
                <h3 class="mobile-panel-title">Spiral Controls</h3>
                <button class="mobile-panel-close" data-target="mobile-spiral-panel">✕</button>
            </div>
            <div class="mobile-spiral-controls">
                <div class="mobile-spiral-section">
                    <h4 class="mobile-spiral-title">Visual Effects</h4>
                    <div class="mobile-spiral-buttons">
                        <button class="mobile-spiral-btn" data-action="toggle-spiral">Toggle Spiral</button>
                        <button class="mobile-spiral-btn" data-action="speed-up">Speed Up</button>
                        <button class="mobile-spiral-btn" data-action="slow-down">Slow Down</button>
                        <button class="mobile-spiral-btn" data-action="reverse">Reverse</button>
                    </div>
                </div>
                <div class="mobile-spiral-section">
                    <h4 class="mobile-spiral-title">Intensity Mode</h4>
                    <div class="mobile-spiral-buttons">
                        <button class="mobile-spiral-btn brainwash" data-action="brainwash-mode">🧠 BRAINWASH MODE 🧠</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="mobile-triggers-panel" class="mobile-panel">
            <div class="mobile-panel-header">
                <h3 class="mobile-panel-title">Trigger Management</h3>
                <button class="mobile-panel-close" data-target="mobile-triggers-panel">✕</button>
            </div>
            <div class="mobile-trigger-categories">
                <!-- Trigger categories will be populated by JavaScript -->
            </div>
        </div>

        <div id="mobile-tts-panel" class="mobile-panel">
            <div class="mobile-panel-header">
                <h3 class="mobile-panel-title">Voice Settings</h3>
                <button class="mobile-panel-close" data-target="mobile-tts-panel">✕</button>
            </div>
            <div class="mobile-voice-selector">
                <!-- Voice options will be populated by JavaScript -->
            </div>
        </div>

        <div id="mobile-ai-panel" class="mobile-panel">
            <div class="mobile-panel-header">
                <h3 class="mobile-panel-title">AI Controls</h3>
                <button class="mobile-panel-close" data-target="mobile-ai-panel">✕</button>
            </div>
            <div class="mobile-collar-section">
                <h4 class="mobile-collar-title">Collar Control</h4>
                <textarea class="mobile-collar-textarea" placeholder="Enter collar text for deeper submission..."></textarea>
                <div class="mobile-collar-buttons">
                    <button class="mobile-collar-btn activate">Activate Collar</button>
                    <button class="mobile-collar-btn deactivate">Deactivate Collar</button>
                </div>
            </div>
        </div>

        <!-- Mobile Dropdown Overlay -->
        <div class="mobile-dropdown-overlay">
            <div class="mobile-dropdown-content">
                <!-- Dynamic content will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Load scripts in order -->
    <script src="/js/effects.js"></script>
    <script src="/js/triggers.js"></script>
    <script src="/js/text2speech.js"></script>
    <script src="/js/psychodelic-trigger-mania.js"></script>
    <script type="module" src="/js/dropdowns.js"></script>
    <script src="/js/aigf-core.js"></script>
    <script src="/js/mobile-interface.js"></script>
</body>
</html>
