<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BambiSleep Chat</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Spiral Animation Canvas -->
        <div id="spiral-container">
        </div>

        <!-- Chat Container -->
        <div id="chat-container">
            <div id="chat-header">
                <h1>BambiSleep Chat</h1>
                <div id="controls" class="controls">
                    <button id="toggle-spiral">Toggle Spiral</button>
                    <button id="toggle-tts">TTS: OFF</button>
                    <button id="toggle-triggers">Triggers: OFF</button>
                    <button id="toggle-ai" class="control-button">AI: OFF</button>
                    <button id="toggle-collar" class="control-button">🔗 Collar: OFF</button>
                </div>
                <div id="trigger-selector" class="trigger-controls">
                    <label for="trigger-select">Active Triggers:</label>
                    <select id="trigger-select" multiple size="3">
                        <option value="BAMBI SLEEP" selected>BAMBI SLEEP</option>
                        <option value="GOOD GIRL" selected>GOOD GIRL</option>
                        <option value="BLANK" selected>BLANK</option>
                        <option value="MINDLESS">MINDLESS</option>
                        <option value="OBEY">OBEY</option>
                        <option value="SUBMIT">SUBMIT</option>
                        <option value="BIMBO">BIMBO</option>
                        <option value="DOLL">DOLL</option>
                        <option value="PINK">PINK</option>
                        <option value="SPIRAL">SPIRAL</option>
                    </select>
                </div>
            </div>

            <div id="chat-messages"></div>

            <div id="chat-input-container">
                <input type="text" id="chat-input" placeholder="Type your message..." maxlength="500">
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>

    <!-- Load scripts in order -->
    <script src="/js/triggers.js"></script>
    <script src="/js/text2speech.js"></script>
    <script src="/js/psychodelic-trigger-mania.js"></script>
    <script src="/js/aigf-core.js"></script>
</body>
</html>
