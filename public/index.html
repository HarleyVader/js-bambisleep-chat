<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BambiSleepChat</title>

  <!-- Favicon and Icon Links for All Devices -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/site.webmanifest">

  <!-- Mobile Web App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BambiSleep.Chat">
  <meta name="application-name" content="BambiSleep.Chat">

  <!-- Dynamic CSS Loading - Mobile vs Desktop Detection -->
  <script>
    // Detect if device is mobile/tablet vs desktop
    function isMobileDevice() {
      const userAgent = navigator.userAgent.toLowerCase();
      const isMobileUA = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent);
      const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

      // Consider it mobile if it matches mobile user agent OR has touch capability
      return isMobileUA || isTouchDevice;
    }

    // Load appropriate CSS based on device type
    function loadDeviceCSS() {
      const head = document.head;

      // Always load the base style.css
      const baseCSS = document.createElement('link');
      baseCSS.rel = 'stylesheet';
      baseCSS.href = '/css/style.css';
      head.appendChild(baseCSS);

      // Always load the buttons.css
      const buttonsCSS = document.createElement('link');
      buttonsCSS.rel = 'stylesheet';
      buttonsCSS.href = '/css/buttons.css';
      head.appendChild(buttonsCSS);

      // Always load chat.css for global chat styling
      const chatCSS = document.createElement('link');
      chatCSS.rel = 'stylesheet';
      chatCSS.href = '/css/chat.css';
      head.appendChild(chatCSS);

      // Always load aigf.css for AI brainwash mode styling
      const aigfCSS = document.createElement('link');
      aigfCSS.rel = 'stylesheet';
      aigfCSS.href = '/css/aigf.css';
      head.appendChild(aigfCSS);

      // Only load mobile.css if it's actually a mobile device
      if (isMobileDevice()) {
        const mobileCSS = document.createElement('link');
        mobileCSS.rel = 'stylesheet';
        mobileCSS.href = '/css/mobile.css';
        head.appendChild(mobileCSS);

        // Add mobile class to body for additional targeting
        document.addEventListener('DOMContentLoaded', function() {
          document.body.classList.add('mobile-device');
        });
      } else {
        // Add desktop class to body for additional targeting
        document.addEventListener('DOMContentLoaded', function() {
          document.body.classList.add('desktop-device');
        });
      }
    }

    // Load CSS immediately
    loadDeviceCSS();
  </script>

  <!-- Always load spirals.css -->
  <link rel="stylesheet" href="/css/spirals.css">

  <!-- Always load brainwave.css -->
  <link rel="stylesheet" href="/css/brainwave.css">

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>
  <div id="app">
    <!-- Spiral Animation Canvas -->
    <div id="spiral-container">
      <div id="eye" class="spiral-text-center"></div>
    </div>

    <!-- Chat Container -->
    <div id="chat-container">
      <div id="chat-header">
        <h1>🧠BambiSleep.Chat🌀</h1>
        <div id="controls" class="controls">
          <div class="dropdown">
            <button id="toggle-spiral" class="dropdown-btn toggle-button" data-state="off">🌀Spiral: OFF</button>
            <div class="dropdown-content">
              <!-- Content will be populated by spiral-dropdown.js -->
            </div>
          </div>
          <div class="dropdown">
            <button id="toggle-tts" class="dropdown-btn toggle-button" data-state="off">🔊TTS: OFF</button>
            <div class="dropdown-content">
              <!-- Content will be populated by tts-dropdown.js -->
            </div>
          </div>
          <div class="dropdown">
            <button id="toggle-triggers" class="dropdown-btn toggle-button" data-state="off">🎯Triggers: OFF</button>
            <div class="dropdown-content">
              <!-- Content will be populated by triggers-dropdown.js -->
            </div>
          </div>
          <div class="dropdown">
            <button id="toggle-ai" class="dropdown-btn toggle-button" data-state="off">🌸AIGF: OFF</button>
            <div class="dropdown-content">
              <!-- Content will be populated by ai-dropdown.js -->

          </div>
          <div class="dropdown collar-dropdown">
            <button id="toggle-collar" class="dropdown-btn toggle-button" data-state="off">⛓️Collar: OFF</button>
            <div class="dropdown-content">
              <!-- Content will be populated by collar-dropdown.js -->
            </div>
          </div>
          <div id="brainwave-dropdown-container">
            <!-- Brainwave dropdown will be populated by brainwave-dropdown.js -->
          </div>
        </div>
      </div>

      <!-- Global Chat Messages Container -->
      <div id="global-chat-messages">
        <!-- Global community chat messages appear here -->
      </div>

      <!-- Global Chat Input Container -->
      <div id="global-chat-input-container">
        <input type="text" id="global-chat-input" placeholder="Type global message..." maxlength="500">
        <button id="global-send-button">Send Global</button>
      </div>

      <!-- AIGF Chat Messages Container -->
      <div id="aigf-chat-messages">
        <!-- AI brainwash mode messages appear here -->
      </div>

      <!-- AIGF Chat Input Container -->
      <div id="aigf-chat-input-container">
        <input type="text" id="aigf-chat-input" placeholder="Type AIGF message..." maxlength="500">

      <div class="docs-link-container">
        <button id="toggle-chat" class="dropdown-btn toggle-button" data-state="on">💬Chat: ON</button>

    </div>
  </div>

  <!-- Load scripts in order -->
  <script src="/js/effects.js"></script>

  <script src="/js/text2speech.js"></script>
  <script src="/js/brainwave.js"></script>
  <script src="/js/psychodelic-trigger-mania.js"></script>
  <script type="module" src="/js/dropdowns.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/aigf-core.js"></script>
  <script src="/js/mobile-interface.js"></script>

  <!-- Auto-fetch BambiSleep.info favicon -->
  <script>
    async function fetchBambiSleepFavicon() {
      try {
        const wikiBtn = document.getElementById('wiki-btn');
        if (!wikiBtn) return;

        // Try different MediaWiki and common favicon paths (enhanced order)
        const faviconPaths = [
          'https://bambisleep.info/favicon.ico', // Standard root favicon
          'https://bambisleep.info/w/favicon.ico', // MediaWiki /w/ directory
          'https://bambisleep.info/wiki/favicon.ico', // MediaWiki /wiki/ directory
          'https://bambisleep.info/skins/common/images/favicon.ico', // MediaWiki skins directory
          'https://bambisleep.info/resources/assets/favicon.ico', // MediaWiki resources directory
          'https://bambisleep.info/favicon.png', // PNG variants
          'https://bambisleep.info/w/favicon.png',
          'https://bambisleep.info/apple-touch-icon.png', // Apple touch icon
          'https://bambisleep.info/android-chrome-192x192.png' // Android chrome icon
        ];

        let faviconFound = false;

        for (const path of faviconPaths) {
          try {
            const response = await fetch(path, {
              method: 'HEAD',
              mode: 'no-cors' // Allow cross-origin requests
            });

            // Create img element to test if favicon loads
            const img = new Image();
            img.crossOrigin = 'anonymous';

            const imageLoadPromise = new Promise((resolve, reject) => {
              img.onload = () => resolve(true);
              img.onerror = () => reject(false);
              setTimeout(() => reject(false), 3000); // 3 second timeout
            });

            img.src = path;

            try {
              await imageLoadPromise;
              // Successfully loaded favicon
              wikiBtn.innerHTML = `<img src="${path}" alt="Wiki" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 4px;"> Wiki`;
              faviconFound = true;
              console.log(`✅ BambiSleep favicon loaded from: ${path}`);
              break;
            } catch {
              // Continue to next path
              continue;
            }
          } catch {
            // Continue to next path
            continue;
          }
        }

        if (!faviconFound) {
          // Fallback: Try to extract favicon from page HTML
          try {
            const response = await fetch('https://bambisleep.info', {
              mode: 'cors'
            });
            const html = await response.text();

            // Look for favicon links in HTML (multiple patterns for MediaWiki)
            const faviconPatterns = [
              /<link[^>]*rel=["'](?:shortcut )?icon["'][^>]*href=["']([^"']+)["']/i,
              /<link[^>]*href=["']([^"']+)["'][^>]*rel=["'](?:shortcut )?icon["']/i,
              /<link[^>]*rel=["']apple-touch-icon["'][^>]*href=["']([^"']+)["']/i
            ];

            let faviconUrl = null;
            for (const pattern of faviconPatterns) {
              const match = html.match(pattern);
              if (match) {
                faviconUrl = match[1].startsWith('http') ?
                  match[1] :
                  `https://bambisleep.info${match[1]}`;
                break;
              }
            }

            if (faviconUrl) {
              const img = new Image();
              img.onload = () => {
                wikiBtn.innerHTML = `<img src="${faviconUrl}" alt="Wiki" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 4px;"> Wiki`;
                console.log(`✅ BambiSleep favicon extracted from HTML: ${faviconUrl}`);
              };
              img.onerror = () => {
                console.log(`⚠️ Extracted favicon failed to load: ${faviconUrl}`);
              };
              img.src = faviconUrl;
            } else {
              console.log('⚠️ No favicon found in HTML');
            }
          } catch (e) {
            console.log('⚠️ Could not fetch BambiSleep favicon, keeping default emoji');
          }
        }

        if (!faviconFound) {
          // Final fallback: Try MediaWiki load.php resource loader pattern
          try {
            const loadPhpFavicon = 'https://bambisleep.info/load.php?modules=skins.vector.styles&only=styles&skin=vector&format=css';
            console.log('⚠️ All direct favicon paths failed, tried MediaWiki paths but keeping default 📖 emoji');
          } catch (e) {
            console.log('⚠️ MediaWiki resource loading also failed');
          }
        }

      } catch (error) {
        console.log('⚠️ BambiSleep favicon fetch failed:', error.message);
        console.log('📖 Keeping default emoji - this is normal if bambisleep.info has CORS restrictions');
        // Keep default emoji if fetch fails
      }
    }

    // Auto-fetch favicon when page loads
    document.addEventListener('DOMContentLoaded', fetchBambiSleepFavicon);
  </script>
</body>

</html>
