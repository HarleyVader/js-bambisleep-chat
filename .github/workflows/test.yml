---
name: Test Suite
"on":
  push:
    branches: [main, production, development]
  pull_request:
    branches: [main, production, development]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run critical tests
        run: npm run test:critical
        env:
          NODE_ENV: test

      - name: Run full test suite
        run: npm test
        env:
          NODE_ENV: test
          TEST_REPORTS: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: tests/reports/
          retention-days: 30

      - name: Security audit
        run: npm audit --audit-level moderate
        continue-on-error: true

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for console.log statements
        run: |
          echo "Checking for console.log in production code..."
          if grep -r "console\.log" src/ \
            --exclude-dir=node_modules --exclude-dir=tests; then
            echo "Warning: console.log statements found in src/"
            exit 0
          fi

      - name: Check file structure
        run: |
          echo "Validating project structure..."
          test -f package.json
          test -f README.md
          test -d tests
          test -d scripts
          echo "Structure validation passed"

  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:fast
        env:
          NODE_ENV: production

      - name: Check build artifacts
        run: |
          echo "Checking build output..."
          test -d dist || echo "No dist directory (expected)"
          echo "Build check complete"
